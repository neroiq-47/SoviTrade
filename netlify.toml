# Next.js app lives in app/. The plugin turns the build into functions and routes.
# Do not put secrets in this file.
[build]
  base = "app"
  command = "npm run build"
  publish = ".next"

[build.environment]
  NODE_VERSION = "22"
  KEEPER_DRY_RUN = "true"

[[plugins]]
  package = "@netlify/plugin-nextjs"
